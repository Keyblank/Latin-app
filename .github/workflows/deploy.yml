name: Deploy su GitHub Pages

# Il ramo di lavoro e' `claude/duolingo-latin-app-pst7r4` — per molto tempo e'
# stato l'UNICO ramo del repository, e il sito veniva pubblicato da li'. Con
# `Source: GitHub Actions` funziona, perche' in quella modalita' non si
# pubblica da un ramo ma dall'artefatto che il workflow carica.
#
# `main` esiste ed e' il ramo predefinito — serve agli strumenti che lo danno
# per scontato — ma NON attiva la pubblicazione. Averlo messo fra i trigger e'
# stato un errore: lo stesso commit spinto su due rami crea due deployment con
# lo stesso identificativo (`deploy-pages` usa il SHA), e GitHub ne annulla
# uno. Un ramo solo pubblica.
on:
  push:
    branches: [claude/duolingo-latin-app-pst7r4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta — ma le run in corso NON si annullano.
#
# `cancel-in-progress: true` sembrava sensato e ci e' costato una giornata:
# `deploy-pages` apre un deployment su GitHub e lo chiude alla fine, ma un job
# annullato a meta' non esegue la chiusura. Il deployment resta «in corso» per
# sempre, e da quel momento OGNI pubblicazione successiva viene respinta con
#
#   Deployment request failed due to in progress deployment.
#   Please cancel <sha> first or wait for it to complete.
#
# Un push di troppo, e il sito non si aggiorna piu' finche' qualcuno non va a
# cancellare a mano il deployment fantasma. Meglio mettersi in coda.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Controlla il corso (forme latine ed esercizi)
        run: npm run check
      - name: Build
        run: npm run build
        env:
          # Il percorso base e' il NOME DEL REPOSITORY, preso da GitHub invece
          # che scritto a mano: cosi' rinominare il repo non rompe il sito, e
          # non resta una stringa da ricordarsi di aggiornare. Serve davvero —
          # quando Pages si e' impiantato, rinominare e' stata l'unica leva
          # rimasta, e un percorso scritto a mano l'avrebbe resa piu' cara.
          BASE_PATH: /${{ github.event.repository.name }}/
      # `enablement: true` non e' un dettaglio: senza, l'azione si limita a
      # LEGGERE la configurazione del sito e se e' sbagliata la lascia stare.
      #
      # Passando da «GitHub Actions» a «Deploy from a branch» e ritorno — cosa
      # che si finisce per fare mentre si cerca di capire perche' non pubblica
      # — il sito puo' restare registrato come `legacy`. Un sito legacy che
      # riceve un artefatto di tipo `workflow` non lo elabora: il deployment
      # entra in coda e ci resta finche' l'azione non va in timeout, senza mai
      # un messaggio d'errore. Con `true` l'azione lo riporta a `workflow`.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
