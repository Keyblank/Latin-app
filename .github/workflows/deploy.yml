name: Deploy su GitHub Pages

# Il ramo di lavoro e' `claude/duolingo-latin-app-pst7r4` — per molto tempo e'
# stato l'UNICO ramo del repository, e il sito veniva pubblicato da li'. Con
# `Source: GitHub Actions` funziona, perche' in quella modalita' non si
# pubblica da un ramo ma dall'artefatto che il workflow carica.
#
# `main` e' stato aggiunto dopo, quando il sito ha smesso di pubblicarsi: un
# repository il cui unico ramo si chiama `claude/...` e' un'anomalia, e la
# prima creazione di un sito Pages passa dal ramo predefinito.
on:
  push:
    branches: [main, claude/duolingo-latin-app-pst7r4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Controlla il corso (forme latine ed esercizi)
        run: npm run check
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /Latin-app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
